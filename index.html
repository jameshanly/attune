<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Device Synced Audio Player</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin-top:40px;">

<h2>Multi-Device Synced Audio Player</h2>

<h3>1. Enable Audio</h3>
<button id="unlockBtn">Tap to Enable Audio</button>

<h3>2. Choose Audio</h3>
<div id="trackList">Loading audio files...</div>

<h3>3. Schedule Start Time</h3>
<p>Start time is provided by server for multi-device sync.</p>

<br><br>
<button id="armBtn" disabled>ARM SYNC</button>

<p id="status">Audio not enabled.</p>

<script>
let audioCtx;
let audioBuffer = null;
let audioUnlocked = false;
let scheduledSource = null;

// -------------------------------
// Load JSON audio list
// -------------------------------
fetch("audio_list.json")
  .then(res => res.json())
  .then(tracks => {
    const container = document.getElementById("trackList");
    container.innerHTML = "";

    tracks.forEach((track, index) => {
      const label = document.createElement("label");
      label.innerHTML =
        `<input type="radio" name="track"
           value="${track.file}"
           ${index===0 ? "checked" : ""}>
         ${track.name}`;
      container.appendChild(label);
      container.appendChild(document.createElement("br"));
    });

    document.getElementById("status").innerText = "Tap 'Enable Audio' to start.";
  })
  .catch(err => {
    console.error(err);
    document.getElementById("trackList").innerText = "Unable to load audio list.";
  });

// -------------------------------
// Enable Audio (gesture-safe)
document.getElementById("unlockBtn").addEventListener("click", async () => {
  const chosen = document.querySelector('input[name="track"]:checked');
  if (!chosen) {
    alert("Select a track first.");
    return;
  }

  // Create AudioContext
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  await audioCtx.resume();

  // Load and decode audio
  fetch(chosen.value)
    .then(res => res.arrayBuffer())
    .then(data => audioCtx.decodeAudioData(data))
    .then(buffer => {
      audioBuffer = buffer;
      audioUnlocked = true;
      document.getElementById("unlockBtn").style.display = "none";
      document.getElementById("armBtn").disabled = false;
      document.getElementById("status").innerText = "Audio enabled. Ready to ARM SYNC.";
    })
    .catch(err => {
      console.error("Audio decode failed:", err);
      alert("Failed to load audio. Try again.");
    });
});

// -------------------------------
// ARM SYNC with server timestamp
document.getElementById("armBtn").addEventListener("click", async () => {
  if (!audioUnlocked || !audioBuffer) {
    alert("Enable audio first.");
    return;
  }

  try {
    // Fetch start timestamp from server (milliseconds since epoch)
    const response = await fetch("/start_time.json");
    const data = await response.json();
    const serverStartMs = data.startTime; // e.g., 1700000000000

    const nowMs = Date.now();
    const delaySec = (serverStartMs - nowMs) / 1000;

    if (scheduledSource) {
      scheduledSource.stop();
      scheduledSource = null;
    }

    if (delaySec <= 0) {
      // Start immediately if past time
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start();
      document.getElementById("status").innerText = "PLAYING NOW";
      return;
    }

    // Schedule playback using AudioContext
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioCtx.destination);

    // Scheduled AudioContext time
    const scheduledTime = audioCtx.currentTime + delaySec;
    source.start(scheduledTime);
    scheduledSource = source;

    document.getElementById("status").innerText =
      `Armed. Starts in ${delaySec.toFixed(2)} seconds (server time)`;

  } catch (err) {
    console.error("Failed to fetch server start time:", err);
    alert("Could not get server start time.");
  }
});
</script>

</body>
</html>
