<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synced Audio Player</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin-top:40px;">

<h2>Synced Audio Player</h2>

<h3>1. Choose Audio</h3>
<div id="trackList">Loading audio files...</div>

<h3>2. Enter Start Time (24-hour)</h3>
<input type="time" id="startTime" step="1">

<br><br>
<button onclick="armSync()">ARM SYNC</button>

<p id="status">Tap anywhere once to enable audio</p>

<audio id="audio" preload="auto" playsinline></audio>

<script>
let startTime = null;
let scheduledTimeout = null;
let audioUnlocked = false;

const audio = document.getElementById("audio");
const status = document.getElementById("status");

// --------------------------------------------
// iOS / mobile audio unlock
// --------------------------------------------
document.body.addEventListener('click', () => {
  if (audioUnlocked) return;
  audio.play()
    .then(() => {
      audio.pause();
      audio.currentTime = 0;
      audioUnlocked = true;
      status.innerHTML = "Audio enabled. Ready.";
    })
    .catch(()=>{});
}, { once: true });

// --------------------------------------------
// LOAD AUDIO LIST FROM JSON
// --------------------------------------------
fetch("audio_list.json")
  .then(response => response.json())
  .then(tracks => {
    const container = document.getElementById("trackList");
    container.innerHTML = "";

    tracks.forEach((track, index) => {
      const label = document.createElement("label");
      label.innerHTML =
        `<input type="radio" name="track"
           value="${track.file}"
           ${index===0 ? "checked" : ""}>
         ${track.name}`;
      container.appendChild(label);
      container.appendChild(document.createElement("br"));
    });
  })
  .catch(err => {
    console.error(err);
    document.getElementById("trackList").innerHTML =
      "Unable to load audio list.";
  });

// --------------------------------------------
// ARM SYNC FUNCTION
// --------------------------------------------
function armSync() {
  if (!audioUnlocked) {
    alert("Tap anywhere first to enable audio.");
    return;
  }

  const chosen = document.querySelector('input[name="track"]:checked');
  if (!chosen) {
    alert("Choose a track");
    return;
  }

  // Set audio src and preload
  audio.src = chosen.value;
  audio.load();
  audio.currentTime = 0;

  // Pre-buffer with small delay to allow decoding
  setTimeout(() => {
    audio.play().then(() => {
      audio.pause();
      audio.currentTime = 0;
      status.innerHTML = "Audio buffered. Waiting for sync...";
    }).catch(()=>{});
  }, 50);

  // Parse start time
  const timeInput = document.getElementById("startTime").value;
  if (!timeInput) {
    alert("Enter a start time");
    return;
  }

  const now = new Date();
  const today =
    now.getFullYear() + "-" +
    String(now.getMonth()+1).padStart(2,'0') + "-" +
    String(now.getDate()).padStart(2,'0');

  startTime = new Date(today + "T" + timeInput);

  if (isNaN(startTime)) {
    alert("Invalid start time format");
    return;
  }

  const delay = startTime - Date.now();

  if (scheduledTimeout) clearTimeout(scheduledTimeout);

  if (delay <= 0) {
    status.innerHTML = "Start time already passed. Playing now.";
    audio.play();
    return;
  }

  scheduledTimeout = setTimeout(() => {
    audio.play();
    status.innerHTML = "PLAYING";
  }, delay);

  status.innerHTML = "Armed. Starts in " + (delay / 1000).toFixed(1) + " seconds";
}
</script>

</body>
</html>
