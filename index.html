<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synced Audio Player</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin-top:40px;">

<h2>Synced Audio Player</h2>

<h3>1. Enable Audio</h3>
<button id="unlockBtn">Tap to Enable Audio</button>

<h3>2. Choose Audio</h3>
<div id="trackList">Loading audio files...</div>

<h3>3. Enter Start Time (24-hour)</h3>
<input type="time" id="startTime" step="1">

<br><br>
<button id="armBtn" disabled>ARM SYNC</button>

<p id="status">Audio not enabled.</p>

<audio id="audio" preload="auto" playsinline></audio>

<script>
let startTime = null;
let scheduledTimeout = null;
let audioUnlocked = false;

const audio = document.getElementById("audio");
const status = document.getElementById("status");
const unlockBtn = document.getElementById("unlockBtn");
const armBtn = document.getElementById("armBtn");

// -------------------------------
// Load JSON audio list
// -------------------------------
fetch("audio_list.json")
  .then(response => response.json())
  .then(tracks => {
    const container = document.getElementById("trackList");
    container.innerHTML = "";

    tracks.forEach((track, index) => {
      const label = document.createElement("label");
      label.innerHTML =
        `<input type="radio" name="track"
           value="${track.file}"
           ${index===0 ? "checked" : ""}>
         ${track.name}`;
      container.appendChild(label);
      container.appendChild(document.createElement("br"));
    });

    status.innerHTML = "Tap 'Enable Audio' to start.";
  })
  .catch(err => {
    console.error(err);
    document.getElementById("trackList").innerHTML = "Unable to load audio list.";
  });

// -------------------------------
// Enable Audio (gesture-safe for mobile)
// -------------------------------
unlockBtn.addEventListener('click', () => {
  const chosen = document.querySelector('input[name="track"]:checked');
  if (!chosen) {
    alert("Please select a track first.");
    return;
  }

  audio.src = chosen.value;
  audio.load();
  audio.currentTime = 0;

  // Gesture-safe pre-buffer
  audio.play().then(() => {
    audio.pause();
    audio.currentTime = 0;
    audioUnlocked = true;
    unlockBtn.style.display = "none"; // hide enable button
    armBtn.disabled = false;          // allow ARM SYNC
    status.innerHTML = "Audio enabled and pre-buffered. Ready to ARM SYNC.";
  }).catch(err => {
    console.log("Audio unlock failed:", err);
    alert("Tap again to enable audio.");
  });
});

// -------------------------------
// ARM SYNC
// -------------------------------
armBtn.addEventListener('click', () => {
  if (!audioUnlocked) {
    alert("Enable audio first.");
    return;
  }

  const chosen = document.querySelector('input[name="track"]:checked');
  if (!chosen) {
    alert("Choose a track.");
    return;
  }

  // Ensure the selected track is loaded
  if (audio.src !== chosen.value) {
    audio.src = chosen.value;
    audio.load();
    audio.currentTime = 0;
  }

  const timeInput = document.getElementById("startTime").value;
  if (!timeInput) {
    alert("Enter a start time.");
    return;
  }

  // Parse start time
  const now = new Date();
  const today =
    now.getFullYear() + "-" +
    String(now.getMonth()+1).padStart(2,'0') + "-" +
    String(now.getDate()).padStart(2,'0');

  startTime = new Date(today + "T" + timeInput);
  if (isNaN(startTime)) {
    alert("Invalid start time format");
    return;
  }

  const delay = startTime - Date.now();
  if (scheduledTimeout) clearTimeout(scheduledTimeout);

  if (delay <= 0) {
    status.innerHTML = "Start time already passed. Playing now.";
    audio.play();
    return;
  }

  scheduledTimeout = setTimeout(() => {
    audio.play().then(() => {
      status.innerHTML = "PLAYING";
    }).catch(err => {
      console.log("Playback failed:", err);
      status.innerHTML = "Playback failed (mobile gesture may be required)";
    });
  }, delay);

  status.innerHTML = "Armed. Starts in " + (delay/1000).toFixed(1) + " seconds";
});
</script>

</body>
</html>
