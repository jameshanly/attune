<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;text-align:center;margin-top:40px;">

<h2>Synced Audio Player</h2>

<h3>1. Choose Audio</h3>
<div id="trackList">Loading tracks...</div>

<h3>2. Enter Start Time</h3>
<input type="time" id="startTime" step="1">

<br><br>
<button onclick="armSync()">ARM SYNC</button>

<p id="status">Not armed</p>

<audio id="audio" preload="auto"></audio>

<script>

let startTime;
let started = false;
let selectedTrack = null;

const audio = document.getElementById("audio");
const status = document.getElementById("status");


// ⭐ LOAD AUDIO LIST DYNAMICALLY
fetch("audio_list.json")
  .then(response => response.json())
  .then(tracks => {

    const container = document.getElementById("trackList");
    container.innerHTML = "";

    tracks.forEach((track, index) => {

      const label = document.createElement("label");

      label.innerHTML =
        `<input type="radio" name="track"
          value="${track.file}"
          ${index===0 ? "checked" : ""}>
          ${track.name}`;

      container.appendChild(label);
      container.appendChild(document.createElement("br"));
    });

  });


function armSync() {

  const chosen =
    document.querySelector('input[name="track"]:checked');

  if (!chosen) {
    alert("Choose a track");
    return;
  }

  selectedTrack = chosen.value;

  audio.src = selectedTrack;
  audio.load();

  const timeInput =
    document.getElementById("startTime").value;

  if (!timeInput) {
    alert("Enter a start time");
    return;
  }

  const now = new Date();
  const today =
    now.getFullYear() + "-" +
    String(now.getMonth()+1).padStart(2,'0') + "-" +
    String(now.getDate()).padStart(2,'0');

  startTime = new Date(today + "T" + timeInput);

  started = false;
  status.innerHTML = "Armed. Waiting...";
}


// ⭐ CLOCK WATCHER
setInterval(() => {

  if (!startTime || started) return;

  const now = new Date();
  const diff = (startTime - now) / 1000;

  if (diff <= 0) {
    audio.play();
    status.innerHTML = "PLAYING";
    started = true;
  } else {
    status.innerHTML =
      "Starts in " + diff.toFixed(1) + " seconds";
  }

}, 50);

</script>

</body>
</html>
