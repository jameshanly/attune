<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synced Audio Player (Web Audio API)</title>
</head>
<body style="font-family:sans-serif;text-align:center;margin-top:40px;">

<h2>Synced Audio Player (Web Audio API)</h2>

<h3>1. Enable Audio</h3>
<button id="unlockBtn">Tap to Enable Audio</button>

<h3>2. Choose Audio</h3>
<div id="trackList">Loading audio files...</div>

<h3>3. Enter Start Time (24-hour)</h3>
<input type="time" id="startTime" step="1">

<br><br>
<button id="armBtn" disabled>ARM SYNC</button>

<p id="status">Audio not enabled.</p>

<script>
let audioCtx;
let audioBuffer = null;
let audioUnlocked = false;
let startTime = null;
let scheduledSource = null;

// -------------------------------
// Load JSON audio list
// -------------------------------
fetch("audio_list.json")
  .then(res => res.json())
  .then(tracks => {
    const container = document.getElementById("trackList");
    container.innerHTML = "";

    tracks.forEach((track, index) => {
      const label = document.createElement("label");
      label.innerHTML =
        `<input type="radio" name="track"
           value="${track.file}"
           ${index===0 ? "checked" : ""}>
         ${track.name}`;
      container.appendChild(label);
      container.appendChild(document.createElement("br"));
    });
    document.getElementById("status").innerText = "Tap 'Enable Audio' to start.";
  })
  .catch(err => {
    console.error(err);
    document.getElementById("trackList").innerText = "Unable to load audio list.";
  });

// -------------------------------
// Enable Audio (gesture-safe)
document.getElementById("unlockBtn").addEventListener("click", async () => {
  const chosen = document.querySelector('input[name="track"]:checked');
  if (!chosen) {
    alert("Select a track first.");
    return;
  }

  // Create AudioContext
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  await audioCtx.resume();

  // Load and decode audio
  fetch(chosen.value)
    .then(res => res.arrayBuffer())
    .then(data => audioCtx.decodeAudioData(data))
    .then(buffer => {
      audioBuffer = buffer;
      audioUnlocked = true;
      document.getElementById("unlockBtn").style.display = "none";
      document.getElementById("armBtn").disabled = false;
      document.getElementById("status").innerText = "Audio enabled and ready to ARM SYNC.";
    })
    .catch(err => {
      console.error("Audio decode failed:", err);
      alert("Failed to load audio. Try again.");
    });
});

// -------------------------------
// ARM SYNC
document.getElementById("armBtn").addEventListener("click", () => {
  if (!audioUnlocked || !audioBuffer) {
    alert("Enable audio first.");
    return;
  }

  const timeInput = document.getElementById("startTime").value;
  if (!timeInput) {
    alert("Enter a start time.");
    return;
  }

  // Parse start time
  const now = new Date();
  const today =
    now.getFullYear() + "-" +
    String(now.getMonth()+1).padStart(2,'0') + "-" +
    String(now.getDate()).padStart(2,'0');
  startTime = new Date(today + "T" + timeInput);

  if (isNaN(startTime)) {
    alert("Invalid start time format");
    return;
  }

  const delaySec = (startTime - Date.now()) / 1000;

  if (scheduledSource) {
    scheduledSource.stop(); // Stop previous schedule if any
    scheduledSource = null;
  }

  if (delaySec <= 0) {
    // Start immediately
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioCtx.destination);
    source.start();
    document.getElementById("status").innerText = "PLAYING NOW";
    return;
  }

  // Schedule playback using AudioContext
  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtx.destination);

  // schedule at precise AudioContext time
  const scheduledTime = audioCtx.currentTime + delaySec;
  source.start(scheduledTime);
  scheduledSource = source;

  document.getElementById("status").innerText =
    `Armed. Starts in ${delaySec.toFixed(2)} seconds`;
});
</script>

</body>
</html>
