<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clock Locked Sync Player</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin-top: 40px;
}

button {
  font-size: 18px;
  padding: 12px 20px;
  margin: 10px;
}

#status {
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>Clock-Locked Sync Player</h2>

<div id="audioList">Loading audio files…</div>

<button onclick="enableAudio()">Enable Audio</button>
<button onclick="armSync()">ARM SYNC</button>

<div id="status">Idle</div>

<script>
let audioContext;
let audioBuffer = null;
let selectedAudioFile = null;
let clockOffset = 0;

/* ===============================
   LOAD AUDIO LIST FROM JSON
================================ */

async function loadAudioList() {

  const response = await fetch("audio-files.json");
  const files = await response.json();

  const container = document.getElementById("audioList");
  container.innerHTML = "";

  files.forEach((file, index) => {

    const label = document.createElement("label");
    label.style.display = "block";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "audio";
    radio.value = "audio/" + file;

    if (index === 0) {
      radio.checked = true;
      selectedAudioFile = radio.value;
    }

    radio.onchange = () => {
      selectedAudioFile = radio.value;
    };

    label.appendChild(radio);
    label.appendChild(document.createTextNode(" " + file));

    container.appendChild(label);
  });
}

loadAudioList();

/* ===============================
   ENABLE AUDIO (REQUIRED FOR iOS)
================================ */

async function enableAudio() {

  document.getElementById("status").innerText =
    "Enabling audio...";

  audioContext =
    new (window.AudioContext || window.webkitAudioContext)();

  // resume required on iOS
  await audioContext.resume();

  if (!selectedAudioFile) {
    alert("Select an audio file first");
    return;
  }

  const response = await fetch(selectedAudioFile);
  const arrayBuffer = await response.arrayBuffer();

  audioBuffer =
    await audioContext.decodeAudioData(arrayBuffer);

  document.getElementById("status").innerText =
    "Audio Ready ✅";
}

/* ===============================
   ARM SYNC (CLOCK LOCKED)
================================ */

async function armSync() {

  if (!audioContext || !audioBuffer) {
    alert("Enable audio first");
    return;
  }

  document.getElementById("status").innerText =
    "Arming sync...";

  try {

    const t0 = Date.now();

    const response = await fetch("/api/start-time");
    const data = await response.json();

    const t1 = Date.now();

    const roundTrip = t1 - t0;

    // latency compensated server time
    const estimatedServerNow =
      data.serverNow + (roundTrip / 2);

    // calculate clock offset
    clockOffset = estimatedServerNow - t1;

    schedulePlayback(data.startTime);

  } catch (err) {
    console.error(err);
    document.getElementById("status").innerText =
      "Could not get server start time ❌";
  }
}

/* ===============================
   PRECISE SCHEDULING
================================ */

function schedulePlayback(sharedStartTime) {

  const correctedNow =
    Date.now() + clockOffset;

  const msUntilStart =
    sharedStartTime - correctedNow;

  if (msUntilStart <= 0) {
    document.getElementById("status").innerText =
      "Missed start window";
    return;
  }

  const when =
    audioContext.currentTime + (msUntilStart / 1000);

  const source =
    audioContext.createBufferSource();

  source.buffer = audioBuffer;
  source.connect(audioContext.destination);

  source.start(when);

  document.getElementById("status").innerText =
    "Scheduled. Starts in " +
    Math.round(msUntilStart / 1000) +
    " seconds";

  console.log("Playback scheduled in", msUntilStart, "ms");
}
</script>

</body>
</html>
